<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hagah 내려받기</title>
<meta name="description" content="설교 메모 전용 앱 Hagah 최신판 내려받기">
<link rel="icon" href="logo.png">
<meta property="og:title" content="Hagah 내려받기">
<meta property="og:description" content="설교 메모 전용 앱 Hagah 최신판 내려받기">
<meta property="og:image" content="https://antcraft159.github.io/Hagah-Releases/logo.png">
<meta name="color-scheme" content="light">
<style>
  :root {
    --bg: #ffffff;
    --text: #2b1d14;
    --muted: #6f5f53;
    --brand: #4a2c1d;
    --brand-text: #f6dca8;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.65;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 680px; padding: 48px 16px; text-align: center; }

  .hero img { width: 112px; height: 112px; border-radius: 24px; display: block; margin: 0 auto 20px; }
  .hero h1 { font-size: 2.2rem; margin: 0; letter-spacing: 0.02em; }
  .hero p { margin: 6px 0 0; color: var(--muted); }

  .download { margin: 32px 0 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-width: 260px; max-width: 100%;
    padding: 16px 28px;
    border-radius: 14px;
    background: var(--brand); color: var(--brand-text);
    font-size: 1.15rem; font-weight: 700; text-decoration: none;
    transition: transform .1s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(1px); }
  .btn[aria-disabled="true"] { opacity: .55; pointer-events: none; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .meta { margin: 12px 0 0; color: var(--muted); font-size: .92rem; min-height: 1.5em; }

  @media (max-width: 480px) {
    .hero h1 { font-size: 1.9rem; }
    .btn { width: 100%; min-width: 0; }
  }
</style>
</head>
<body>
<main>
  <header class="hero">
    <img src="logo.png" alt="Hagah 로고" width="112" height="112">
    <h1>Hagah</h1>
    <p>설교 메모 전용 앱</p>
  </header>

  <div class="download">
    <a id="dl" class="btn" href="https://github.com/antcraft159/Hagah-Releases/releases" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span id="dl-label">최신판 확인 중…</span>
    </a>
    <p id="meta" class="meta">Windows 10 · 11</p>
  </div>
</main>

<script>
(function () {
  var REPO = "antcraft159/Hagah-Releases";
  var SETUP = "Hagah-win-Setup.exe";

  function ymd(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }
  function mb(bytes) { return (bytes / 1048576).toFixed(0) + "MB"; }

  var dl = document.getElementById("dl");
  var label = document.getElementById("dl-label");
  var meta = document.getElementById("meta");

  // releases/latest 는 prerelease 를 건너뛰므로 목록에서 직접 고른다
  fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=6")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (list) {
      var latest = list.find(function (r) {
        return !r.draft && r.assets.some(function (a) { return a.name === SETUP; });
      });
      if (!latest) throw new Error("no setup");
      var asset = latest.assets.find(function (a) { return a.name === SETUP; });

      dl.href = asset.browser_download_url;
      dl.removeAttribute("aria-disabled");
      label.textContent = "Windows용 내려받기";
      meta.textContent = latest.tag_name + " · " + ymd(latest.published_at) + " · " + mb(asset.size) + " · Windows 10 · 11";
    })
    .catch(function () {
      // API 한도(시간당 60회) 초과 등 — 릴리스 페이지로 보낸다
      dl.removeAttribute("aria-disabled");
      label.textContent = "내려받기 페이지로 가기";
      meta.textContent = "맨 위 릴리스의 Assets 에서 " + SETUP + " 를 받아 주세요.";
    });
})();
</script>
</body>
</html>
