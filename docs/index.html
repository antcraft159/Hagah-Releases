<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hagah 내려받기</title>
<meta name="description" content="설교 메모 전용 앱 Hagah 최신판 내려받기">
<link rel="icon" href="logo.png">
<meta property="og:title" content="Hagah 내려받기">
<meta property="og:description" content="설교 메모 전용 앱 Hagah 최신판 내려받기">
<meta property="og:image" content="https://antcraft159.github.io/Hagah-Releases/logo.png">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Gowun+Batang&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --glow: #f8ecd6;
    --text: #2b1d14;
    --muted: #8a7768;
    --line: #eadfce;
    --brand: #4a2c1d;
    --brand-deep: #331d12;
    --gold: #f2d29b;
    --gold-deep: #c99a52;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(520px 420px at 50% 38%, var(--glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.65;
    word-break: keep-all;
  }
  main { position: relative; z-index: 1; width: 100%; max-width: 560px; padding: 72px 16px; text-align: center; }

  /* ── 주변 장식: 줄 공책 결 · 금빛 액자 · 떠다니는 빛 ── */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  /* 가운데는 비우고 가장자리로 갈수록 보이는 가는 줄 */
  .lines {
    background: repeating-linear-gradient(180deg, transparent 0 33px, rgba(201, 154, 82, .14) 33px 34px);
    -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 35%, #000 100%);
            mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 35%, #000 100%);
  }

  /* 바깥 테두리 두 줄 */
  .frame { inset: 22px; border: 1px solid rgba(201, 154, 82, .45); border-radius: 6px; }
  .frame::before { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(201, 154, 82, .22); border-radius: 3px; }
  .corner { position: absolute; width: 84px; height: 84px; color: var(--gold-deep); }
  .corner.tl { top: -12px; left: -12px; }
  .corner.tr { top: -12px; right: -12px; transform: scaleX(-1); }
  .corner.bl { bottom: -12px; left: -12px; transform: scaleY(-1); }
  .corner.br { bottom: -12px; right: -12px; transform: scale(-1, -1); }

  /* 위아래 가운데 작은 장식 */
  .mark { position: absolute; left: 50%; width: 120px; height: 18px; margin-left: -60px; background: linear-gradient(180deg, transparent 7px, var(--bg) 7px 11px, transparent 11px); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .mark.top { top: -9px; } .mark.bottom { bottom: -9px; }
  .mark i { width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold-deep); opacity: .5; }
  .mark i:nth-child(2) { width: 8px; height: 8px; opacity: .9; }

  /* 천천히 위로 떠오르는 금빛 티끌 */
  .motes span {
    position: absolute; bottom: -20px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 190, 120, .9), rgba(232, 190, 120, 0) 70%);
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: .9; }
    85%  { opacity: .7; }
    100% { transform: translate(var(--dx), -110vh); opacity: 0; }
  }

  /* 위에서부터 차례로 떠오른다 */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .logo {
    width: 132px; height: 132px; border-radius: 30px; margin: 0 auto; overflow: hidden; background: var(--brand);
    box-shadow:
      0 1px 2px rgba(51, 29, 18, .12),
      0 14px 34px -10px rgba(74, 44, 29, .45),
      0 30px 60px -24px rgba(201, 154, 82, .55);
  }

  /* PNG 가장자리의 흰 테두리를 잘라낸다 */
  .logo img { display: block; width: 100%; height: 100%; transform: scale(1.07); }

  h1 {
    margin: 26px 0 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 3.4rem;
    line-height: 1.05;
    letter-spacing: .1em;
    padding-left: .1em; /* 마지막 글자 뒤 자간만큼 밀어 가운데를 맞춘다 */
    color: var(--brand);
  }
  .tagline {
    margin: 10px 0 0;
    font-family: "Gowun Batang", serif;
    font-size: 1.08rem;
    color: var(--muted);
    letter-spacing: .12em;
  }

  .ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 30px auto 34px; width: 180px; }
  .ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-deep)); }
  .ornament::after { transform: scaleX(-1); }
  .ornament span { width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold-deep); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    min-width: 280px; max-width: 100%;
    padding: 18px 34px;
    border-radius: 999px;
    background: linear-gradient(180deg, #5a3624 0%, var(--brand) 55%, var(--brand-deep) 100%);
    color: var(--gold);
    font-size: 1.12rem; font-weight: 600; letter-spacing: .02em; text-decoration: none;
    box-shadow:
      inset 0 1px 0 rgba(242, 210, 155, .25),
      0 10px 24px -8px rgba(74, 44, 29, .6);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow:
      inset 0 1px 0 rgba(242, 210, 155, .3),
      0 16px 30px -10px rgba(74, 44, 29, .65);
  }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 3px; }
  .btn[aria-disabled="true"] { opacity: .6; pointer-events: none; }
  .btn svg { width: 22px; height: 22px; flex: none; }

  .meta {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin: 20px 0 0; padding: 0; list-style: none;
    min-height: 30px;
    font-size: .84rem; color: var(--muted);
  }
  .meta li { padding: 3px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .7); }
  .meta li.ver { color: var(--brand); border-color: var(--gold-deep); font-weight: 600; }
  .meta .plain { border: 0; background: none; }

  @media (max-width: 480px) {
    .logo { width: 112px; height: 112px; border-radius: 26px; }
    h1 { font-size: 2.9rem; }
    .btn { width: 100%; min-width: 0; }
    .frame { inset: 10px; }
    .corner { width: 60px; height: 60px; }
    .corner.tl, .corner.tr { top: -8px; } .corner.bl, .corner.br { bottom: -8px; }
    .corner.tl, .corner.bl { left: -8px; } .corner.tr, .corner.br { right: -8px; }
    main { padding: 64px 30px; }
    .lines { -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 45%, transparent 45%, #000 100%);
                     mask-image: radial-gradient(ellipse 90% 60% at 50% 45%, transparent 45%, #000 100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise { animation: none; opacity: 1; transform: none; }
    .btn { transition: none; }
    .motes { display: none; }
  }
</style>
</head>
<body>
<div class="deco lines" aria-hidden="true"></div>
<div class="deco motes" id="motes" aria-hidden="true"></div>
<div class="deco frame" aria-hidden="true">
  <svg class="corner tl" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 3l6 6-6 6-6-6z" fill="currentColor" stroke="none"/><path d="M14 44C14 26 26 14 44 14"/><path d="M20 34c0-8 6-14 14-14"/><circle cx="44" cy="14" r="1.8" fill="currentColor" stroke="none"/><circle cx="14" cy="44" r="1.8" fill="currentColor" stroke="none"/></svg>
  <svg class="corner tr" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 3l6 6-6 6-6-6z" fill="currentColor" stroke="none"/><path d="M14 44C14 26 26 14 44 14"/><path d="M20 34c0-8 6-14 14-14"/><circle cx="44" cy="14" r="1.8" fill="currentColor" stroke="none"/><circle cx="14" cy="44" r="1.8" fill="currentColor" stroke="none"/></svg>
  <svg class="corner bl" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 3l6 6-6 6-6-6z" fill="currentColor" stroke="none"/><path d="M14 44C14 26 26 14 44 14"/><path d="M20 34c0-8 6-14 14-14"/><circle cx="44" cy="14" r="1.8" fill="currentColor" stroke="none"/><circle cx="14" cy="44" r="1.8" fill="currentColor" stroke="none"/></svg>
  <svg class="corner br" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 3l6 6-6 6-6-6z" fill="currentColor" stroke="none"/><path d="M14 44C14 26 26 14 44 14"/><path d="M20 34c0-8 6-14 14-14"/><circle cx="44" cy="14" r="1.8" fill="currentColor" stroke="none"/><circle cx="14" cy="44" r="1.8" fill="currentColor" stroke="none"/></svg>
  <div class="mark top"><i></i><i></i><i></i></div>
  <div class="mark bottom"><i></i><i></i><i></i></div>
</div>
<main>
  <div class="logo rise d1"><img src="logo.png" alt="Hagah 로고" width="132" height="132"></div>
  <h1 class="rise d2">HAGAH</h1>
  <p class="tagline rise d2">설교 메모 전용 앱</p>

  <div class="ornament rise d3" aria-hidden="true"><span></span></div>

  <div class="rise d4">
    <a id="dl" class="btn" href="https://github.com/antcraft159/Hagah-Releases/releases" aria-disabled="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span id="dl-label">최신판 확인 중…</span>
    </a>
    <ul id="meta" class="meta"><li class="plain">Windows 10 · 11</li></ul>
  </div>
</main>

<script>
// 금빛 티끌을 흩뿌린다 — 위치·크기·속도는 매번 조금씩 다르게
(function () {
  var box = document.getElementById("motes");
  var n = window.innerWidth < 480 ? 10 : 18;
  for (var i = 0; i < n; i++) {
    var s = document.createElement("span");
    var size = 4 + Math.random() * 8;
    s.style.left = (Math.random() * 100) + "%";
    s.style.width = s.style.height = size + "px";
    s.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    s.style.animationDuration = (14 + Math.random() * 16) + "s";
    s.style.animationDelay = (-Math.random() * 30) + "s";
    box.appendChild(s);
  }
})();

(function () {
  var REPO = "antcraft159/Hagah-Releases";
  var SETUP = "Hagah-win-Setup.exe";

  function ymd(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }
  function mb(bytes) { return (bytes / 1048576).toFixed(0) + "MB"; }
  function chips(items) {
    meta.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      li.textContent = it.text;
      if (it.cls) li.className = it.cls;
      meta.appendChild(li);
    });
  }

  var dl = document.getElementById("dl");
  var label = document.getElementById("dl-label");
  var meta = document.getElementById("meta");

  // releases/latest 는 prerelease 를 건너뛰므로 목록에서 직접 고른다
  fetch("https://api.github.com/repos/" + REPO + "/releases?per_page=6")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (list) {
      var latest = list.find(function (r) {
        return !r.draft && r.assets.some(function (a) { return a.name === SETUP; });
      });
      if (!latest) throw new Error("no setup");
      var asset = latest.assets.find(function (a) { return a.name === SETUP; });

      dl.href = asset.browser_download_url;
      dl.removeAttribute("aria-disabled");
      label.textContent = "Windows용 내려받기";
      chips([
        { text: latest.tag_name, cls: "ver" },
        { text: ymd(latest.published_at) },
        { text: mb(asset.size) },
        { text: "Windows 10 · 11" }
      ]);
    })
    .catch(function () {
      // API 한도(시간당 60회) 초과 등 — 릴리스 페이지로 보낸다
      dl.removeAttribute("aria-disabled");
      label.textContent = "내려받기 페이지로 가기";
      chips([{ text: "맨 위 릴리스의 Assets 에서 " + SETUP + " 를 받아 주세요.", cls: "plain" }]);
    });
})();
</script>
</body>
</html>
